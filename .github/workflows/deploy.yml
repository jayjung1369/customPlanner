name: Deploy wedding planner
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node worker/build.mjs
      - run: node scripts/cloudflare-config.mjs
      - name: Apply database migrations
        run: npx --yes wrangler@4.158.0 d1 migrations apply customplanner-schedule --remote --config dist/wrangler.json
      - name: Deploy Worker
        run: npx --yes wrangler@4.158.0 deploy --config dist/wrangler.json
